# Campo de Tiro en contenedor (VPS, o local para probar igual que en el servidor).
# Uso: cp .env.produccion.example .env  ->  editar  ->  ./deploy/levantar.sh

services:
  game:
    build: .
    restart: unless-stopped
    environment:
      MAX_PLAYERS: ${MAX_PLAYERS:-12}
      MAX_PER_IP: ${MAX_PER_IP:-4}
      # 1 si hay un proxy delante (Nginx Proxy Manager, nginx…) para ver la IP real de cada jugador; con 0 no se confía en X-Forwarded-For.
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - "${PUERTO_WEB:-8080}:3000"
