# Cada push a main: pasa las pruebas y despliega en el VPS (rsync + docker compose).
# Secretos del repositorio (Settings > Secrets and variables > Actions):
#   VPS_HOST      IP o dominio del VPS
#   VPS_USER      usuario SSH (con permiso para usar docker)
#   VPS_SSH_KEY   clave PRIVADA SSH de despliegue (la pública va en ~/.ssh/authorized_keys del VPS)
#   VPS_PORT      (opcional) puerto SSH, por defecto 22
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
      TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Subir el código
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude 'deploy/.env' \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            ./ "$TARGET:~/glory-from/"
      - name: Reconstruir y reiniciar
        run: ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$TARGET" 'bash ~/glory-from/deploy/deploy.sh'
